<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Blockchain Wildlife Card System - View top token burners and search for earned wildlife cards verifiable on the Steem blockchain.">
    <title>animalCards</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Outfit:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=3">
    <link rel="stylesheet" href="vaas.css?v=1">

<body>
    <div class="background-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <header class="glass-header">
        <div class="container header-container">
            <h1 class="logo">animal<span>Cards</span></h1>
            <nav class="nav-links">
                <a href="index.html" class="active">Home</a>
                <a href="leaderboard.html">Leaderboard</a>
                <a href="search.html">Portfolio Search</a>
            </nav>
        </div>
    </header>

    <main class="container hero-section">
        <div class="hero-content glass-panel">
            <h2 class="hero-title">Immutable Rewards on the Blockchain</h2>
            <p class="hero-subtitle">Burn tokens, earn unique species cards, and verify your collection deterministically. Welcome to the future of transparent collecting.</p>
            <div class="hero-actions">
                <a href="leaderboard.html" class="btn btn-primary">View Leaderboard</a>
                <a href="search.html" class="btn btn-secondary">Search My Portfolio</a>
            </div>
        </div>
    </main>

    <div class="container">
        <div id="vaas-mount" style="margin: 2.5rem 0;"></div>
    </div>

    <footer class="site-footer">
        <div class="container footer-container">
            <span>animalCards</span>
            <span>•</span>

    <script src="blockchain-api.js?v=13"></script>
    <script src="vaas.js?v=1"></script>
    <script>
        // Drop-in VAAS widget — adopts animalCards' glass design tokens.
        VAAS.init({
            theme: {
                cardBg: 'var(--glass-bg)',
                muted: 'var(--text-secondary)',
                border: 'var(--glass-border)'
            }
        }).mount('#vaas-mount');
    </script>
</body>
</html>
