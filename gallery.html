<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="animalCards gallery — browse every wildlife card in the deck and download card images for blog posts.">
    <title>Gallery - animalCards</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Outfit:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=16">
    <link rel="stylesheet" href="vaas.css?v=2">
    <style>
        .gallery-header { text-align: center; margin: 2.5rem 0 1.5rem; }
        .gallery-header h2 { font-family: 'Outfit', sans-serif; font-size: 2rem; font-weight: 700; margin-bottom: 0.5rem; }
        .gallery-header p { color: var(--text-secondary); font-size: 1.05rem; max-width: 640px; margin: 0 auto 0.5rem; }
        .gallery-toolbar { display: flex; flex-wrap: wrap; gap: 1rem; justify-content: center; align-items: center; margin-bottom: 2rem; }
        .gallery-count { color: var(--text-secondary); font-size: 0.9rem; }
        @media (max-width: 600px) { .gallery-header h2 { font-size: 1.5rem; } }
    </style>
</head>
<body>
    <div class="background-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <header class="glass-header">
        <div class="container header-container">
            <a href="index.html" class="logo">animal<span>Cards</span></a>
            <nav class="nav-links">
                <a href="index.html">Home</a>
                <a href="leaderboard.html">Leaderboard</a>
                <a href="search.html">Portfolio Search</a>
                <a href="collections.html">Collections</a>
                <a href="deck.html">Card Deck</a>
                <a href="gallery.html" class="active">Gallery</a>
            </nav>
        </div>
    </header>

    <main class="container">
        <div class="gallery-header">
            <h2>Card Gallery</h2>
            <p>Every wildlife card in the current deck, ready to download as a standalone PNG for blog posts.</p>
        </div>
        <div class="gallery-toolbar">
            <button type="button" id="download-all" class="btn btn-primary">Download all (ZIP)</button>
            <span id="gallery-count" class="gallery-count"></span>
        </div>
        <div class="cards-grid" id="gallery-grid">
            <div class="loader-container">
                <div class="spinner"></div>
                <p>Loading card deck...</p>
            </div>
        </div>
    </main>

    <footer class="vaas-footer">
        <div class="container">
            <div id="vaas-mount"></div>
        </div>
    </footer>

    <footer class="site-footer">
        <div class="container footer-container">
            <span>animalCards</span>
            <span>•</span>
            <a href="https://github.com/remlaps/animalCards" target="_blank" rel="noopener noreferrer">
                <svg class="footer-github-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                    <path d="M12 .5C5.7.5.5 5.7.5 12c0 5.1 3.3 9.4 7.9 10.9.6.1.8-.2.8-.6v-2c-3.2.7-3.9-1.5-3.9-1.5-.5-1.3-1.3-1.7-1.3-1.7-1-.7.1-.7.1-.7 1.2.1 1.8 1.2 1.8 1.2 1 1.8 2.7 1.3 3.4 1 .1-.8.4-1.3.7-1.6-2.5-.3-5.1-1.2-5.1-5.5 0-1.2.4-2.2 1.1-3-.1-.3-.5-1.4.1-2.9 0 0 .9-.3 3 1.1a10 10 0 0 1 5.5 0c2.1-1.4 3-1.1 3-1.1.6 1.5.2 2.6.1 2.9.7.8 1.1 1.8 1.1 3 0 4.3-2.6 5.2-5.1 5.5.4.3.8 1 .8 2.1v3c0 .3.2.7.8.6A11.5 11.5 0 0 0 23.5 12C23.5 5.7 18.3.5 12 .5z"/>
                </svg>
                GitHub
            </a>
        </div>
    </footer>

    <script src="header.js?v=1"></script>
    <script src="card-resolver.js?v=1"></script>
    <script src="difficulty.js?v=6"></script>
    <script src="blockchain-api.js?v=37"></script>
    <script src="vendor/html-to-image.js?v=1"></script>
    <script src="vendor/jszip.min.js?v=1"></script>
    <script src="card-export.js?v=3"></script>
    <script src="vaas.js?v=6"></script>
    <script>
        VAAS.init({
            scope: 'origin',
            theme: {
                cardBg: 'var(--glass-bg)',
                muted: 'var(--text-secondary)',
                border: 'var(--glass-border)'
            }
        }).mount('#vaas-mount');

        (function () {
            var RARITY_RANK = { Common: 0, Rare: 1, Epic: 2, Legendary: 3, Mythic: 4 };

            function rank(r) {
                return (RARITY_RANK[r] != null) ? RARITY_RANK[r] : -1;
            }

            async function loadGallery() {
                var grid = document.getElementById('gallery-grid');
                try {
                    if (api.cardsConfig.length === 0) await api.loadConfig();
                    var cards = api.cardsConfig.slice();
                    cards.sort(function (a, b) {
                        var d = rank(b.rarity) - rank(a.rarity); // Mythic first
                        if (d !== 0) return d;
                        d = String(a.class || '').localeCompare(String(b.class || ''));
                        if (d !== 0) return d;
                        return String(a.species || '').localeCompare(String(b.species || ''));
                    });

                    grid.innerHTML = '';
                    cards.forEach(function (card) {
                        grid.appendChild(CardExport.renderDeckCard(card));
                    });
                    document.getElementById('gallery-count').textContent = cards.length + ' cards';
                    if (window.__cardImgInit) window.__cardImgInit(grid);
                } catch (e) {
                    grid.innerHTML = '<div class="glass-panel" style="padding:2rem;text-align:center;color:#ef4444;"><p>Failed to load card deck: ' + e.message + '</p></div>';
                }
            }

            document.getElementById('download-all').addEventListener('click', function () {
                var btn = this;
                var nodes = document.querySelectorAll('#gallery-grid .tribute-card');
                if (!nodes.length) return;
                var label = btn.textContent;
                btn.disabled = true;
                CardExport.downloadAll(nodes, 'animalCards-deck', function (done, total) {
                    btn.textContent = 'Preparing ' + done + '/' + total + '…';
                }).catch(function (err) {
                    console.error(err);
                    if (typeof alert === 'function') alert('Export failed: ' + ((err && err.message) || err));
                }).then(function () {
                    btn.disabled = false;
                    btn.textContent = label;
                });
            });

            loadGallery();
        })();
    </script>

</body>
</html>
