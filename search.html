<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Portfolio - animalCards</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Outfit:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=12">
    <link rel="stylesheet" href="vaas.css?v=2">
</head>
<body>
    <div class="background-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <header class="glass-header">
        <div class="container header-container">
            <h1 class="logo">animal<span>Cards</span></h1>
            <nav class="nav-links">
                <a href="index.html">Home</a>
                <a href="leaderboard.html">Leaderboard</a>
                <a href="search.html" class="active">Portfolio Search</a>
                <a href="deck.html">Card Deck</a>
            </nav>
        </div>
    </header>

    <main class="container">
        <div class="page-layout">
            <aside id="difficulty-dashboard" class="difficulty-dashboard difficulty-sidebar">
                <!-- Populated via JS -->
            </aside>
            <div class="page-content">
        <div class="page-header" style="flex-wrap: wrap; gap: 1.5rem;">
            <h2 class="page-title">Search Portfolio</h2>
            
            <form id="search-form" class="controls-section">
                <input type="text" id="account-input" class="search-input" placeholder="Enter Steem username" required>
                
                <select id="time-filter" class="time-select">
                    <option value="86400000">Past 1 Day</option>
                    <option value="604800000">Past 7 Days</option>
                    <option value="2592000000">Past 30 Days</option>
                    <option value="7776000000">Past 90 Days</option>
                    <option value="31536000000">Past 1 Year</option>
                    <option value="0">All Time (Slow)</option>
                </select>

                <button type="submit" class="btn btn-primary" style="padding: 0.75rem 1.5rem;">Search</button>
            </form>
        </div>

        <div id="loading" class="loader-container" style="display: none;">
            <div class="spinner"></div>
            <p id="loading-status">Scanning blockchain for earned cards...</p>
            <p id="loading-progress" style="color: var(--text-secondary); font-size: 0.9rem;"></p>
        </div>

        <div id="search-content" style="display: none;">
            <h3 id="portfolio-header" style="margin-bottom: 1.5rem; font-family: 'Outfit'; font-size: 1.75rem;"></h3>
            <p id="portfolio-stats" style="color: var(--text-secondary); margin-bottom: 1.5rem;"></p>

            <div id="portfolio-summary" style="margin-bottom: 1.5rem;">
                <!-- Summary table populated via JS -->
            </div>

            <div class="controls-section" id="view-toggle" style="display: none; margin-bottom: 1.5rem;">
                <span class="toolbar-label">View:</span>
                <button type="button" class="view-btn active" data-view="all">All Cards</button>
                <button type="button" class="view-btn" data-view="unique">Unique Cards</button>
            </div>

            <div class="controls-section" id="search-filters" style="display: none; flex-wrap: wrap; margin-bottom: 1.5rem;">
                <select id="filter-species" class="time-select" data-all-label="All Species"></select>
                <select id="filter-class" class="time-select" data-all-label="All Classes"></select>
                <select id="filter-rarity" class="time-select" data-all-label="All Rarities"></select>
                <select id="sort-by" class="time-select">
                    <option value="serial" id="sort-option-serial">Sort: Serial</option>
                    <option value="species">Sort: Species</option>
                    <option value="class">Sort: Class</option>
                    <option value="rarity">Sort: Rarity</option>
                    <option value="count">Sort: Count</option>
                </select>
                <button type="button" id="sort-dir" class="btn btn-secondary">Sort ▼</button>
                <button type="button" id="clear-filters" class="btn btn-secondary">Clear Filters</button>
            </div>

            <div class="cards-grid" id="portfolio-grid">
                <!-- Populated via JS -->
            </div>
        </div>
            </div>
        </div>
    </main>

    <footer class="vaas-footer">
        <div class="container">
            <div id="vaas-mount"></div>
        </div>
    </footer>

    <footer class="site-footer">
        <div class="container footer-container">
            <span>animalCards</span>
            <span>•</span>
            <a href="https://github.com/remlaps/animalCards" target="_blank" rel="noopener noreferrer">
                <svg class="footer-github-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                    <path d="M12 .5C5.7.5.5 5.7.5 12c0 5.1 3.3 9.4 7.9 10.9.6.1.8-.2.8-.6v-2c-3.2.7-3.9-1.5-3.9-1.5-.5-1.3-1.3-1.7-1.3-1.7-1-.7.1-.7.1-.7 1.2.1 1.8 1.2 1.8 1.2 1 1.8 2.7 1.3 3.4 1 .1-.8.4-1.3.7-1.6-2.5-.3-5.1-1.2-5.1-5.5 0-1.2.4-2.2 1.1-3-.1-.3-.5-1.4.1-2.9 0 0 .9-.3 3 1.1a10 10 0 0 1 5.5 0c2.1-1.4 3-1.1 3-1.1.6 1.5.2 2.6.1 2.9.7.8 1.1 1.8 1.1 3 0 4.3-2.6 5.2-5.1 5.5.4.3.8 1 .8 2.1v3c0 .3.2.7.8.6A11.5 11.5 0 0 0 23.5 12C23.5 5.7 18.3.5 12 .5z"/>
                </svg>
                GitHub
            </a>
        </div>
    </footer>

    <script src="card-resolver.js?v=1"></script>
<script src="difficulty.js?v=6"></script>
    <script src="blockchain-api.js?v=28"></script>
    <script src="search.js?v=29"></script>
    <script src="vaas.js?v=5"></script>
    <script>
        // Drop-in VAAS widget — adopts animalCards' glass design tokens.
        // scope: 'origin' shares one widget state across all animalCards pages
        // so the ticker stays consistent when navigating between them.
        VAAS.init({
            scope: 'origin',
            theme: {
                cardBg: 'var(--glass-bg)',
                muted: 'var(--text-secondary)',
                border: 'var(--glass-border)'
            }
        }).mount('#vaas-mount');
    </script>
</body>
</html>
